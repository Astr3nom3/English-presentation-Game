<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IDetector — Sci-Fi NeoTech (V2)</title>

  <!-- Style -->
  <link rel="stylesheet" href="style.css">

  <!-- html2canvas for PNG export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- INITIAL ALIEN AUTHENTICATION OVERLAY -->
  <div id="overlay-auth" class="overlay active">
    <div class="overlay-box">
      <h2>GALACTIC ACCESS PROTOCOL</h2>
      <p>Select the correct alien symbol to authenticate.</p>
      <div id="auth-symbols" class="symbol-grid"></div>
      <p id="auth-msg" class="game-message"></p>
    </div>
  </div>

  <!-- APP -->
  <div class="wrap hidden" id="app">
    <header>
      <h1>IDetector — Sci-Fi NeoTech</h1>
      <div class="controls">
        <button id="createMode" class="btn btn-accent">Create ID</button>
        <button id="detectMode" class="btn">Detective Mode</button>
        <button id="detectChallenge" class="btn">Detective Challenge</button>
        <button id="randomAgent" class="btn">Random Agent</button>
      </div>
    </header>

    <main id="main"></main>

    <footer>
      <p class="muted">NeoTech Edition — Galactic ID Creator © 2125</p>
    </footer>
  </div>

  <!-- GALACTIC SCAN OVERLAY (used on download and scan fail) -->
  <div id="scan-overlay">
    <div class="scan-line"></div>
  </div>

  <!-- SFX optional (can be expanded) -->
  <!-- <audio id="scan-sound" src="sounds/scan.wav" preload="auto"></audio> -->

  <script src="script.js"></script>
</body>
</html>
